name: Build ipk

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # Smoke-test that the ucode sources actually compile on a real OpenWrt ucode
  # (node --check cannot catch ucode-incompatible constructs like for...of,
  # array spread, method-style .sort() or `delete`). Fails fast on syntax errors.
  ucode-lint:
    name: ucode syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ucode with real OpenWrt ucode
        run: |
          # The openwrt/rootfs image IS the real OpenWrt userspace and ships
          # /usr/bin/ucode + all ucode modules (fs/uci/ubus/uclient/uloop/digest)
          # built-in, so no opkg/apk install step is needed.
          docker run --rm -v "$PWD/packages/luci-app-aiassist/root:/src:ro" \
            ghcr.io/openwrt/rootfs:x86_64-master sh -c '
            set -e
            command -v ucode >/dev/null 2>&1 || { echo "ucode unavailable in container"; exit 1; }
            mkdir -p /tmp/uc/aiassist /tmp/uc/rpcd
            cp /src/usr/share/ucode/aiassist/*.uc /tmp/uc/aiassist/
            cp /src/usr/share/rpcd/ucode/aiassist /tmp/uc/rpcd/
            export UCODE_LIBRARY_PATH=/tmp/uc
            # NOTE: do NOT run ucode -c on the module files. They use export,
            # which is only legal in module mode (when loaded via import), exactly
            # how rpcd loads them. Compiling them standalone with -c reports a bogus
            # "Exports may only appear at top level of a module" error. So we
            # verify each module by importing it, which is what the real rpcd does.
            echo "== module compile check (via import, as rpcd does) =="
            ucode -e "import * as lib from \"aiassist.lib\"; print(\"lib.uc: compile OK\\n\")"
            ucode -e "import * as proto from \"aiassist.proto\"; print(\"proto.uc: compile OK\\n\")"
            ucode -e "import * as core from \"aiassist.core\"; print(\"core.uc: compile OK\\n\")"
            echo "== rpcd entry (standalone script, no exports) =="
            ucode -c /tmp/uc/rpcd/aiassist && echo "rpcd entry: compile OK"
            echo "== import smoke test =="
            ucode -e "import * as l from \"aiassist.lib\"; import * as p from \"aiassist.proto\"; import * as c from \"aiassist.core\"; print(\"imports OK\\n\")"
            echo "== runtime smoke: load_config + token estimate =="
            mkdir -p /etc/aiassist/sessions
            printf "config aiassist settings\\n\\toption enabled 1\\n" > /etc/config/aiassist
            ucode -e "import { load_config, estimate_session_tokens, create_session } from \"aiassist.lib\"; let cfg = load_config(); print(\"enabled=\" + cfg.enabled + \" provider=\" + cfg.provider + \"\\n\"); let s = create_session(\"ci-smoke\"); print(\"session=\" + s.id + \" tokens=\" + estimate_session_tokens(s) + \"\\n\"); print(\"runtime OK\\n\")"
          '

  build:
    name: ${{ matrix.arch }} (OpenWrt ${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt SDK container tags on ghcr.io/openwrt/sdk use the full <major>.<minor>.<patch>
        # version, e.g. x86_64-24.10.0 (x86_64-24.10 does NOT exist).
        # Only architectures that actually ship a 24.10.0 SDK image are listed.
        branch: [ '24.10.0' ]
        arch:
          - aarch64_cortex-a53   # ARMv8 (RK3328/3399, ipq807x, R2S/R4S ...)
          - x86_64               # x86 soft-router
          - mips_24kc            # MT7620/MT7621 and most MIPS home routers
          - arm_cortex-a7_neon-vfpv4   # MT7623, ipq40xx ...

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ipk via OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          PACKAGES: luci-app-aiassist
          V: s
          # BUILD_LOG: 1
          # IGNORE_ERRORS: 1

      - name: Store built ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}-${{ matrix.branch }}
          # custom feed (action) carries the app itself; also ship the only extra
          # runtime dependency family (curl) so offline install works
          path: |
            bin/packages/${{ matrix.arch }}/action/*.ipk
            bin/packages/${{ matrix.arch }}/packages/curl_*.ipk
            bin/packages/${{ matrix.arch }}/packages/libcurl4_*.ipk
            bin/packages/${{ matrix.arch }}/packages/cgi-io_*.ipk
            bin/packages/${{ matrix.arch }}/packages/libnghttp2-14_*.ipk
          if-no-files-found: error
          retention-days: 14

  # On version tags, publish a consolidated release with every architecture
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # download-artifact preserves the upload dir structure (bin/packages/<arch>/...),
          # so match recursively 
          files: artifacts/**/*.ipk
          generate_release_notes: true
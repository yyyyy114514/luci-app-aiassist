name: ucode-lint

# Reusable workflow: verifies the plugin's ucode sources compile AND run on a
# real OpenWrt ucode interpreter (the exact thing rpcd does on the router).
# This catches what `node --check` and the static scanner cannot:
#   - for...of / spread / .sort() / `delete` / regex \u escapes
#   - module export rules (export only legal in module mode)
#   - lexical shadowing / TDZ errors detected at compile time
# It is called by build.yml as a gate (build only starts after this passes),
# and can also run on its own (PR paths filter, manual dispatch).
on:
  workflow_call:
  pull_request:
    paths:
      - 'packages/luci-app-aiassist/root/usr/share/ucode/**'
      - 'packages/luci-app-aiassist/root/usr/share/rpcd/**'
      - 'packages/luci-app-aiassist/root/usr/libexec/**'
      - '.github/workflows/ucode-lint.yml'
  workflow_dispatch:

jobs:
  ucode-lint:
    name: ucode syntax + import + runtime smoke (real OpenWrt ucode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile & smoke-test with real OpenWrt ucode
        run: |
          # ghcr.io/openwrt/rootfs:x86_64-master is the real OpenWrt userspace
          # and ships /usr/bin/ucode + all ucode modules (fs/uci/ubus/uclient/
          # uloop/digest) built-in - no opkg/apk install step needed.
          docker run --rm -v "$PWD/packages/luci-app-aiassist/root:/src:ro" \
            ghcr.io/openwrt/rootfs:x86_64-master sh -c '
            set -e
            command -v ucode >/dev/null 2>&1 || { echo "ucode unavailable in container"; exit 1; }
            # The rootfs container runs as root; install the plugin exactly the
            # way the ipk would: modules to real /usr/share/ucode, entry to
            # /usr/share/rpcd/ucode. ucode resolves "aiassist.lib" via the
            # standard module search path (no env var needed).
            mkdir -p /usr/share/ucode/aiassist /usr/share/rpcd/ucode /usr/libexec/aiassist
            cp /src/usr/share/ucode/aiassist/*.uc /usr/share/ucode/aiassist/
            cp /src/usr/share/rpcd/ucode/aiassist /usr/share/rpcd/ucode/aiassist
            cp /src/usr/libexec/aiassist/worker.uc /usr/libexec/aiassist/worker.uc
            # NOTE: never run ucode -c directly on module files (they use export,
            # only legal in module mode). Compile them by importing, which is
            # exactly how rpcd loads them.
            echo "== module compile check (via import, as rpcd does) =="
            ucode -e "import * as lib from \"aiassist.lib\"; print(\"lib.uc: compile OK\\n\")"
            ucode -e "import * as proto from \"aiassist.proto\"; print(\"proto.uc: compile OK\\n\")"
            ucode -e "import * as core from \"aiassist.core\"; print(\"core.uc: compile OK\\n\")"
            echo "== rpcd entry + worker (standalone scripts, no exports) =="
            ucode -c /usr/share/rpcd/ucode/aiassist && echo "rpcd entry: compile OK"
            ucode -c /usr/libexec/aiassist/worker.uc && echo "worker.uc: compile OK"
            # Execute the rpcd entry exactly like rpcd does: the script top-level
            # returns { aiassist: methods } and rpcd registers those ubus objects.
            # Actually running it (not just -c) proves the full import chain and
            # the returned signature object are valid at runtime.
            echo "== rpcd entry: execute (load as rpcd does) =="
            ucode -e "let f = loadfile(\"/usr/share/rpcd/ucode/aiassist\"); let sig = f(); print(\"entry executed, keys: \" + keys(sig) + \"\\n\"); if (!sig.aiassist) { print(\"ERROR: no aiassist object in returned signature\\n\"); exit(1); } print(\"entry signature OK\\n\")"
            echo "== import smoke test =="
            ucode -e "import * as l from \"aiassist.lib\"; import * as p from \"aiassist.proto\"; import * as c from \"aiassist.core\"; print(\"imports OK\\n\")"
            echo "== runtime smoke: load_config + token estimate =="
            mkdir -p /etc/aiassist/sessions
            printf "config aiassist settings\\n\\toption enabled 1\\n" > /etc/config/aiassist
            ucode -e "import { load_config, estimate_session_tokens, create_session } from \"aiassist.lib\"; let cfg = load_config(); print(\"enabled=\" + cfg.enabled + \" provider=\" + cfg.provider + \"\\n\"); let s = create_session(\"ci-smoke\"); print(\"session=\" + s.id + \" tokens=\" + estimate_session_tokens(s) + \"\\n\"); print(\"runtime OK\\n\")"
          '

  # Reproduce the exact ucode the user's router runs (ImmortalWrt 24.10.6 /
  # OpenWrt 24.10 line, ucode 2025.07.18), not just the master snapshot.
  # Catches version-specific syntax gaps (e.g. arrow functions / optional
  # chaining / template literals that newer ucode accepts but 24.10 does not).
  ucode-2410:
    name: ucode 24.10 (user firmware) compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with ucode from ImmortalWrt 24.10.6 (2025.07.18)
        run: |
          docker run --rm -v "$PWD/packages/luci-app-aiassist/root:/src:ro" \
            ghcr.io/openwrt/rootfs:x86_64-master sh -c '
            set -e
            # replace the container ucode with the 24.10 userspace build
            # (same x86_64 musl ABI, so the binaries run in this rootfs)
            BASE=https://downloads.immortalwrt.org/releases/24.10.6/packages/x86_64/base
            VER=2025.07.18~3f64c808-r1
            cd /tmp
            for p in "ucode_${VER}_x86_64.ipk" "ucode-mod-fs_${VER}_x86_64.ipk" \
                     "ucode-mod-uci_${VER}_x86_64.ipk" "libucode20230711_${VER}_x86_64.ipk"; do
              echo "downloading $p"
              wget -q "$BASE/$p" -O pkg.ipk
              tar xzf pkg.ipk
              tar xzf data.tar.gz
            done
            cp -f /tmp/usr/bin/ucode /usr/bin/ucode
            cp -f /tmp/usr/lib/libucode.so.20230711 /usr/lib/libucode.so.20230711
            cp -f /tmp/usr/lib/ucode/fs.so /tmp/usr/lib/ucode/uci.so /usr/lib/ucode/
            echo "ucode version:"; ucode -V 2>/dev/null || strings /usr/bin/ucode | grep -m1 '2025' || true
            echo "== probe: which module export forms does 24.10 ucode accept? =="
            mkdir -p /usr/share/ucode/probe
            printf "export function f() { return 1; }\n" > /usr/share/ucode/probe/t1.uc
            printf "export const f = function() { return 2; };\n" > /usr/share/ucode/probe/t2.uc
            printf "const x = 5;\nexport function f() { return x; }\n" > /usr/share/ucode/probe/t3.uc
            printf "function f() { return 4; }\nexport { f };\n" > /usr/share/ucode/probe/t4.uc
            printf "function f() { return 5; }\n" > /usr/share/ucode/probe/t5.uc
            for t in t1 t2 t3 t4 t5; do
              if ucode -e "import * as m from 'probe.$t'; print('$t import OK keys=' + keys(m) + '\\n')" 2>/tmp/err.txt; then
                echo "PROBE $t: PASS"
              else
                echo "PROBE $t: FAIL -> $(head -2 /tmp/err.txt | tail -1)"
              fi
            done
            mkdir -p /usr/share/ucode/aiassist /usr/share/rpcd/ucode /usr/libexec/aiassist
            cp /src/usr/share/ucode/aiassist/*.uc /usr/share/ucode/aiassist/
            cp /src/usr/share/rpcd/ucode/aiassist /usr/share/rpcd/ucode/aiassist
            cp /src/usr/libexec/aiassist/worker.uc /usr/libexec/aiassist/worker.uc
            echo "== module compile check (24.10 ucode, via import) =="
            ucode -e "import * as lib from \"aiassist.lib\"; print(\"lib.uc: compile OK\\n\")"
            ucode -e "import * as proto from \"aiassist.proto\"; print(\"proto.uc: compile OK\\n\")"
            ucode -e "import * as core from \"aiassist.core\"; print(\"core.uc: compile OK\\n\")"
            echo "== rpcd entry + worker =="
            ucode -c /usr/share/rpcd/ucode/aiassist && echo "rpcd entry: compile OK"
            ucode -c /usr/libexec/aiassist/worker.uc && echo "worker.uc: compile OK"
            echo "== rpcd entry execute =="
            ucode -e "let f = loadfile(\"/usr/share/rpcd/ucode/aiassist\"); let sig = f(); print(\"entry keys: \" + keys(sig) + \"\\n\"); if (!sig.aiassist) { print(\"ERROR: no aiassist object\\n\"); exit(1); } print(\"entry signature OK\\n\")"
            echo "== runtime smoke (24.10 ucode) =="
            mkdir -p /etc/aiassist/sessions
            printf "config aiassist settings\\n\\toption enabled 1\\n" > /etc/config/aiassist
            ucode -e "import { load_config, estimate_session_tokens, create_session } from \"aiassist.lib\"; let cfg = load_config(); print(\"enabled=\" + cfg.enabled + \"\\n\"); let s = create_session(\"ci-smoke\"); print(\"session=\" + s.id + \" tokens=\" + estimate_session_tokens(s) + \"\\n\"); print(\"runtime OK\\n\")"
          '
